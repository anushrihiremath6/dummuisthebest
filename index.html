<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>To My Beautiful Sankranti Light 🌞🪁❤️</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --vh: 1vh; }

body {
  font-family: 'Georgia', serif;
  background: #0a1621;
  color: #fff;
  overflow: hidden;
  touch-action: manipulation;
}

/* Background */
#bg-slideshow { position: fixed; inset: 0; z-index: -2; }
#bg-slideshow img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 3.5s ease-in-out;
}
#bg-slideshow img.active { opacity: 0.9; }

.overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.65));
  z-index: -1;
}

/* Layout */
.main-content {
  height: calc(var(--vh) * 100);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 12px;
  z-index: 5;
}

.intro {
  font-size: clamp(1rem, 4.5vw, 1.4rem);
  line-height: 1.5;
  color: #f5e8d3;
}

/* Photo */
#photo-container {
  width: 95%;
  max-width: 420px;
  height: min(60vh, 420px);
  border-radius: 26px;
  overflow: hidden;
  margin: 12px 0;
  box-shadow: 0 15px 50px rgba(0,0,0,0.8);
  background: #111;
}

#photo-slideshow img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 2s ease, transform 8s ease;
}
#photo-slideshow img.active {
  opacity: 0.8;
  transform: scale(1.05);
}

/* Caption */
.caption {
  font-size: clamp(1rem, 4vw, 1.3rem);
  max-width: 90%;
  line-height: 1.6;
  color: #ffe9c7;
  margin-top: 10px;
  padding: 12px;
  background: rgba(0,0,0,0.55);
  border-radius: 15px;
  opacity: 0;
  transform: translateY(30px);
  transition: all 1.2s ease;
  backdrop-filter: blur(6px);
  animation: heartbeat 3s infinite ease-in-out;
}
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
.caption.show { opacity: 1; transform: translateY(0); }

/* Buttons */
#special-btn {
  margin-top: 14px;
  padding: 12px 28px;
  font-size: 1.2rem;
  background: rgba(255,50,100,0.85);
  border: none;
  border-radius: 50px;
  color: white;
  cursor: pointer;
  opacity: 0;
  transition: opacity 1s, transform 0.3s;
  box-shadow: 0 0 20px rgba(255,100,150,0.6);
}
#special-btn.visible { opacity: 1; }
#special-btn:active { transform: scale(0.95); }

/* Navigation */
.nav-arrow {
  position: fixed;
  bottom: 45%;
  font-size: 2.2rem;
  color: rgba(255,255,255,0.6);
  cursor: pointer;
  z-index: 6;
}
.left { left: 10px; }
.right { right: 10px; }

/* Music */
.heart-btn {
  position: fixed;
  bottom: 18px;
  right: 18px;
  background: rgba(210,40,90,0.85);
  color: white;
  border: none;
  border-radius: 50%;
  width: 60px;
  height: 60px;
  font-size: 2rem;
  cursor: pointer;
  z-index: 10;
}

canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}
</style>
</head>

<body>

<canvas id="heartCanvas"></canvas>
<div id="bg-slideshow"></div>
<div class="overlay"></div>

<div class="main-content">
  <div class="intro">
    Happy Makara Sankranti Dummmmmu🫠🌞🪁<br>
    In these golden fields and endless skies of harvest joy,<br>
    your beauty feels right at home — more radiant than any sunrise...
  </div>

  <div id="photo-container">
    <div id="photo-slideshow"></div>
  </div>

  <div class="caption" id="currentCaption">Loading your special moments... 💕</div>
  <button id="special-btn">Tap for My Secret 💕</button>
</div>

<span class="nav-arrow left" id="prev">←</span>
<span class="nav-arrow right" id="next">→</span>

<button class="heart-btn" id="muteBtn">🔇</button>

<!-- 🔥 AUDIO FIXED -->
<audio id="bgMusic" loop playsinline preload="auto">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
/* VH fix */
function setVH(){ document.documentElement.style.setProperty('--vh', `${innerHeight*0.01}px`); }
setVH(); addEventListener('resize', setVH);

/* Music – MOBILE SAFE */
const audio = document.getElementById("bgMusic");
const mute = document.getElementById("muteBtn");
audio.volume = 0.25;

function unlockAudio(){
  audio.play().then(()=>{
    mute.textContent = "🔊";
    removeEventListener("click", unlockAudio);
    removeEventListener("touchstart", unlockAudio);
  }).catch(()=>{});
}
addEventListener("click", unlockAudio);
addEventListener("touchstart", unlockAudio);

mute.onclick = () => {
  audio.muted = !audio.muted;
  mute.textContent = audio.muted ? "🔇" : "🔊";
};
</script>

</body>
</html>
