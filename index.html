<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sankranti Celebration 🌾💛</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Georgia,serif;}

body{
  overflow:hidden;
  background:#87ceeb;
  transition:background 6s linear;
  position:relative;
}

/* MUSIC PROMPT FULLSCREEN */
#musicPrompt{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(#87ceeb,#9acd32);
  z-index:9999;
  text-align:center;
}
#musicPrompt button{
  padding:16px 28px;
  font-size:20px;
  border-radius:30px;
  border:none;
  cursor:pointer;
}

/* SUN */
.sun{
  position:absolute;
  top:12%;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:80px;
  border-radius:50%;
  background:radial-gradient(circle,#fffde7,#fbc02d);
  box-shadow:0 0 120px rgba(255,193,7,0.9);
  z-index:2;
  transition:top 6s;
}

/* SANKRANTI WISH */
.sankranti-wish{
  position:absolute;
  top:8%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  color:#fff8e1;
  font-size:2em;
  text-shadow:0 0 20px rgba(255,193,7,0.9);
  z-index:999;
}
.sankranti-wish span{
  display:block;
  font-size:0.8em;
  margin-top:6px;
}

/* MOUNTAINS */
.mountains{
  position:absolute;
  bottom:40%;
  width:100%;
  height:25%;
  background:linear-gradient(to top,#455a64,#90a4ae);
  clip-path: polygon(0 100%,10% 60%,25% 80%,40% 50%,55% 75%,70% 45%,85% 70%,100% 55%,100% 100%);
  z-index:1;
}

/* DIALOGUE */
.dialogue{
  position:absolute;
  top:38%;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.95);
  padding:14px 20px;
  border-radius:20px;
  max-width:90%;
  text-align:center;
  font-size:1em;
  z-index:4;
  transition:opacity 1s;
}

/* SLIDESHOW */
.slideshow{
  position:absolute;
  bottom:18%;
  left:50%;
  transform:translateX(-50%);
  width:80%;
  max-width:280px;
  height:45%;
  max-height:380px;
  border-radius:22px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 25px 60px rgba(0,0,0,0.45);
  z-index:5;
}
.slideshow img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 2s ease, transform 6s ease;
}
.slideshow img.active{
  opacity:1;
  transform:scale(1.05);
}

/* FIELD SUGARCANE */
.field{
  position:absolute;
  bottom:0;
  width:100%;
  height:40%;
  z-index:3;
}
.stalk{
  position:absolute;
  bottom:0;
  width:6px;
  height:150px;
  background:linear-gradient(to top,#1b5e20,#4caf50);
  transform-origin:bottom;
  border-radius:3px;
}
.leaf{
  position:absolute;
  width:20px;
  height:6px;
  background:#388e3c;
  border-radius:3px;
  left:-7px;
  transform-origin:left center;
}

/* BIRDS & KITES */
.birds,.kites{position:absolute; inset:0; pointer-events:none;}
.bird{position:absolute;width:18px;height:10px;border-top:2px solid #222;border-radius:50%;animation:flap .6s alternate infinite;}
@keyframes flap{from{transform:rotate(5deg);}to{transform:rotate(-5deg);}}
.kite{position:absolute;width:34px;height:34px;background:linear-gradient(45deg,#ff5252,#ffca28);transform:rotate(45deg);}
.kite::after{content:'';position:absolute;width:2px;height:50px;background:rgba(0,0,0,0.3);top:34px;left:16px;}

/* MOBILE FIXES */
@media(max-width:768px){
  .sun{width:60px;height:60px;top:10%;}
  .sankranti-wish{font-size:1.8em;top:5%;}
  .dialogue{top:35%;font-size:.95em;}
  .slideshow{width:90%;height:40%;}
}
</style>
</head>
<body class="sunrise">

<!-- MUSIC PROMPT -->
<div id="musicPrompt">
  <button id="startButton">Tap to Begin Sankranti 🌾🎶</button>
</div>

<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<!-- VISUALS -->
<div class="sun" id="sun"></div>
<div class="sankranti-wish" id="wish">🌾 Happy Sankranti! 🌞💛<br><span>May your day shine like the harvest sun</span></div>
<div class="mountains" id="mountains"></div>
<div class="dialogue" id="dialogue">The morning wakes up gently… just to see you 🌅💛</div>
<div class="slideshow" id="slideshow">
  <img src="photo1.jpg" class="active">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
  <img src="photo4.jpg">
  <img src="photo5.jpg">
</div>
<div class="birds" id="birds"></div>
<div class="kites" id="kites"></div>
<div class="field" id="field"></div>

<script>
const musicPrompt = document.getElementById("musicPrompt");
const startButton = document.getElementById("startButton");
const bgMusic = document.getElementById("bgMusic");
const sun = document.getElementById("sun");
const wish = document.getElementById("wish");
const mountains = document.getElementById("mountains");
const dialogue = document.getElementById("dialogue");
const slideshow = document.getElementById("slideshow");
const birdsEl = document.getElementById("birds");
const kitesEl = document.getElementById("kites");
const field = document.getElementById("field");

startButton.onclick = () => {
  bgMusic.play();
  musicPrompt.style.display="none";

  // Show elements
  sun.style.display="block";
  wish.style.display="block";
  mountains.style.display="block";
  dialogue.style.display="block";
  slideshow.style.display="block";
  birdsEl.style.display="block";
  kitesEl.style.display="block";
  field.style.display="block";
};

/* SLIDESHOW + DIALOGUE */
const slides = document.querySelectorAll(".slideshow img");
const lines = [
"The morning wakes up gently… just to see you 🌅💛",
"Sunrise feels warmer when your smile exists ☀️😊",
"As the day grows brighter, so does my admiration 💫",
"Even the fields bloom softer when you are near 🌾💚",
"Afternoons feel calm… thinking of you feels like rest 🌤️",
"Time slows down when your presence fills the day ⏳💛",
"As the sun leans west, my thoughts stay with you 🌇",
"Evening whispers your name in the wind 🌬️💞",
"Sunset wishes it could be as beautiful as you 🌅✨",
"And as the day rests, my feelings grow deeper 🌙💛"
];
let i=0;
setInterval(()=>{
  slides[i].classList.remove("active");
  i=(i+1)%slides.length;
  slides[i].classList.add("active");
  dialogue.style.opacity=0;
  setTimeout(()=>{ dialogue.textContent = lines[i%lines.length]; dialogue.style.opacity=1; },600);

  if(i===2){document.body.className="noon"; sun.style.top="10%";}
  if(i===6){document.body.className="sunset"; sun.style.top="25%";}
  if(i===9){document.body.className="night"; sun.style.top="40%";}
},15000);

/* SUGARCANE */
for(let s=0;s<40;s++){
  const stalk = document.createElement("div");
  stalk.className="stalk";
  stalk.style.left = s*25+"px";
  for(let l=0;l<3;l++){
    const leaf = document.createElement("div");
    leaf.className="leaf";
    leaf.style.top = 20+l*30 + "px";
    leaf.style.transform=`rotate(${Math.random()*30-15}deg)`;
    stalk.appendChild(leaf);
  }
  field.appendChild(stalk);
}
(function sway(){
  document.querySelectorAll(".stalk").forEach((s,i)=>{
    s.style.transform=`rotate(${Math.sin(Date.now()/1000+i)*8}deg)`;
  });
  requestAnimationFrame(sway);
})();

/* BIRDS */
for(let b=0;b<6;b++){
  const bird=document.createElement("div");
  bird.className="bird";
  bird.style.top=Math.random()*200+40+"px";
  bird.style.left=-100-Math.random()*200+"px";
  birdsEl.appendChild(bird);
}
(function fly(){
  document.querySelectorAll(".bird").forEach(b=>{
    let x=parseFloat(b.style.left);
    x+=1.5;
    if(x>innerWidth+50)x=-100;
    b.style.left=x+"px";
  });
  requestAnimationFrame(fly);
})();

/* KITES */
for(let k=0;k<3;k++){
  const kite = document.createElement("div");
  kite.className="kite";
  kite.style.left=Math.random()*80+"%";
  kite.style.top=Math.random()*150+60+"px";
  kitesEl.appendChild(kite);
}
(function floatKites(){
  document.querySelectorAll(".kite").forEach((k,i)=>{
    k.style.transform=`translateY(${Math.sin(Date.now()/1200+i)*15}px) rotate(45deg)`;
  });
  requestAnimationFrame(floatKites);
})();
</script>
</body>
</html>
