<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Immersive Sankranthi Experience 🌾</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Georgia', serif;
  background: linear-gradient(to bottom, #87ceeb 0%, #ffe9a3 45%, #7bc96f 60%, #2e7d32 100%);
  transition: background 6s linear;
  overflow-x: hidden;
}

/* MUSIC PROMPT */
#musicPrompt {
  position: fixed;
  inset: 0;
  background: linear-gradient(#87ceeb, #9acd32);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#musicPrompt button {
  font-size: 18px;
  padding: 14px 26px;
  border: none;
  border-radius: 30px;
  background: white;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

/* INTRO */
#intro {
  position: fixed;
  inset: 0;
  background: linear-gradient(#ffecb3, #c8e6c9);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  animation: introFade 6s forwards;
  text-align: center;
  padding: 20px;
}

@keyframes introFade {
  0%,80% {opacity:1}
  100% {opacity:0; pointer-events:none}
}

/* SUN */
.sun {
  position: absolute;
  top: 8vh;
  left: 50%;
  transform: translateX(-50%);
  width: 20vw;
  max-width: 120px;
  aspect-ratio: 1;
  background: radial-gradient(circle, #fffde7, #fbc02d);
  border-radius: 50%;
  box-shadow: 0 0 100px rgba(255,193,7,.9);
  z-index: 1;
}

/* MOUNTAINS */
.mountains {
  position: absolute;
  bottom: 40%;
  width: 100%;
  height: 25%;
  background: linear-gradient(to top, #455a64, #90a4ae);
  clip-path: polygon(0 100%, 10% 55%, 25% 75%, 40% 45%, 55% 70%, 70% 40%, 85% 65%, 100% 50%, 100% 100%);
  z-index: 1;
}

/* SLIDESHOW */
.slideshow {
  position: absolute;
  bottom: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 80vw;
  max-width: 300px;
  aspect-ratio: 3/4;
  border-radius: 24px;
  overflow: hidden;
  background: white;
  box-shadow: 0 25px 60px rgba(0,0,0,.45);
  z-index: 5;
}

.slideshow img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  opacity: 0;
  transition: opacity 2s ease, transform 6s ease;
}

.slideshow img.active {
  opacity: 1;
  transform: scale(1.05);
}

/* DIALOGUE */
.dialogue {
  position: absolute;
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,.95);
  padding: 18px 22px;
  border-radius: 22px;
  width: 85%;
  max-width: 380px;
  text-align: center;
  font-size: 1.05rem;
  z-index: 6;
}

/* FIELD */
.field {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 40%;
  z-index: 2;
}

/* SUGARCANE */
.stalk {
  position: absolute;
  bottom: 0;
  width: 6px;
  height: 160px;
  background: linear-gradient(#4caf50, #1b5e20);
  transform-origin: bottom;
}
.leaf {
  position: absolute;
  width: 22px;
  height: 6px;
  background: #388e3c;
  top: 30%;
  left: -8px;
  transform-origin: left center;
}

/* BIRDS */
.birds {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}
.bird {
  position: absolute;
  width: 20px;
  height: 10px;
  border-top: 2px solid #222;
  border-radius: 50%;
}

/* KITES */
.kites {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 4;
}
.kite {
  position: absolute;
  width: 36px;
  height: 36px;
  background: linear-gradient(45deg, #ff5252, #ffca28);
  transform: rotate(45deg);
  animation: kite 4s ease-in-out infinite alternate;
}
@keyframes kite {
  from {transform: translateY(0) rotate(40deg)}
  to {transform: translateY(-20px) rotate(50deg)}
}
</style>
</head>

<body>

<div id="musicPrompt">
  <button onclick="startMusic()">Tap to begin this Sankranthi 🌾💛🎶</button>
</div>

<div id="intro">
  <h1>Happy Makar Sankranthi Dummmmmmmmu 🌾</h1>
  <p>This festival feels brighter… because of you.</p>
</div>

<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="sun" id="sun"></div>
<div class="mountains"></div>

<div class="slideshow" id="slideshow">
  <!-- keep your 20 images -->
  <img src="photo1.jpg" class="active">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
  <img src="photo4.jpg">
  <img src="photo5.jpg">
  <img src="photo6.jpg">
  <img src="photo7.jpg">
  <img src="photo8.jpg">
  <img src="photo9.jpg">
  <img src="photo10.jpg">
  <img src="photo11.jpg">
  <img src="photo12.jpg">
  <img src="photo13.jpg">
  <img src="photo14.jpg">
  <img src="photo15.jpg">
  <img src="photo16.jpg">
  <img src="photo17.jpg">
  <img src="photo18.jpg">
  <img src="photo19.jpg">
  <img src="photo20.jpg">
</div>

<div class="dialogue" id="dialogue"></div>
<div class="field" id="field"></div>
<div class="birds" id="birds"></div>
<div class="kites" id="kites"></div>

<script>
function startMusic(){
  document.getElementById("bgMusic").play();
  document.getElementById("musicPrompt").style.display="none";
}

/* SLIDES + TEXT */
const slides=document.querySelectorAll(".slideshow img");
const dialogue=document.getElementById("dialogue");
let i=0;
const lines=[
"The morning wakes up gently… just to see you. 🌅",
"Sunrise feels warmer when your smile exists. ☀️",
"As the day grows brighter, so does my admiration for you. 🌼",
"Even the fields bloom softer when you are near. 🌾",
"Afternoons feel calm… because thinking of you feels like rest. 🍃",
"Time slows down when your presence fills the day. ⏳",
"As the sun leans west, my thoughts still stay with you. 🌤️",
"Evening whispers your name in the wind. 🌬️",
"Sunset paints the sky… wishing it could be as beautiful as you. 🌅❤️",
"And as the day rests, my feelings for you only grow deeper. 🌌💖"
];

dialogue.innerText=lines[0];

setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
dialogue.style.opacity=0;
setTimeout(()=>{
dialogue.innerText=lines[i%lines.length];
dialogue.style.opacity=1;
},800);
},15000);

/* SUGARCANE */
const field=document.getElementById("field");
for(let s=0;s<35;s++){
 const stalk=document.createElement("div");
 stalk.className="stalk";
 stalk.style.left=`${s*3}%`;
 for(let l=0;l<3;l++){
  const leaf=document.createElement("div");
  leaf.className="leaf";
  leaf.style.top=`${30+l*25}px`;
  stalk.appendChild(leaf);
 }
 field.appendChild(stalk);
}
function sway(){
 document.querySelectorAll(".stalk").forEach((s,i)=>{
  s.style.transform=`rotate(${Math.sin(Date.now()/800+i)*8}deg)`;
 });
 requestAnimationFrame(sway);
}
sway();

/* BIRDS */
const birds=document.getElementById("birds");
for(let b=0;b<6;b++){
 const bird=document.createElement("div");
 bird.className="bird";
 bird.style.top=`${Math.random()*30+5}%`;
 bird.style.left=`${-20-Math.random()*40}px`;
 birds.appendChild(bird);
}
function fly(){
 document.querySelectorAll(".bird").forEach(b=>{
  b.style.left=(parseFloat(b.style.left)+0.6)+"px";
  if(parseFloat(b.style.left)>window.innerWidth) b.style.left="-40px";
 });
 requestAnimationFrame(fly);
}
fly();
</script>

</body>
</html>
